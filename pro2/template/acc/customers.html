{% extends 'base.html' %}
{% load static %}
{% block content %}

<h3>All Customers</h3>
<hr>
<a class="btn btn-success btn-block" href="{% url 'create_customer' %}">
    Create Customer
</a>

<table class="table table-sm">
    <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>View</th>
    </tr>

    {% for customer in customers %}
    <tr>
        <td>{{ customer.name }}</td>
        <td>{{ customer.phone }}</td>
        <td>
            <a class="btn btn-sm btn-info" href="{% url 'customer' customer.id %}">
                View
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
