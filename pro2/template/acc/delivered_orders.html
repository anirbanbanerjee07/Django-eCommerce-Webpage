{% extends 'base.html' %}
{% load static %}
{% block content %}
<br>

<div class="row">
	<div class="col-md">
		
		<div class="card card-body">
			<h5>Delivered Orders</h5>
		</div>

		<div class="card card-body">
			<table class="table">
				<tr>
					<th>Customer</th>
					<th>Product</th>
					<th>Date</th>
					<th>Image</th>
					<th>Status</th>
				</tr>

				{% for i in orders %}
				<tr>
					<td>{{ i.customer }}</td>
					<td>{{ i.product }}</td>
					<td>{{ i.date_created }}</td>

					<td>
						{% if i.product.pic %}
							<img src="{{ i.product.pic.url }}" height="50" width="50">
						{% else %}
							<span class="text-muted">No Image</span>
						{% endif %}
					</td>

					<td>
						<span class="badge bg-success">Delivered</span>
					</td>
				</tr>
				{% endfor %}
			</table>
		</div>

	</div>
</div>

{% endblock %}
